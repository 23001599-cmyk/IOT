; Dieu khien 2 LED bang 1 nut bam (OneButton)
;   single click -> bat/tat LED dang chon
;   double click -> doi LED dang chon (LED1 <-> LED2)
;   giu nut      -> LED dang chon nhap nhay 200 ms
;
; LED1 = LED tren board (built-in) | LED2 = LED ngoai | BTN = nut bam ngoai (noi GPIO -> GND)

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    mathertel/OneButton @ ^2.6.1

; ESP32 DevKit v1
;   LED1: GPIO2 (LED xanh tren board, active HIGH)
;   LED2: GPIO4 -> R 220 ohm -> LED -> GND (active HIGH)
;   BTN : GPIO18 -> nut bam -> GND (dung dien tro keo len noi bo)
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
build_flags =
    '-D LED1_PIN=2U'
    '-D LED1_ACT=HIGH'
    '-D LED2_PIN=4U'
    '-D LED2_ACT=HIGH'
    '-D BTN_PIN=18U'
    '-D BTN_ACT=LOW'

; ESP32-C3 Super Mini
;   LED1: GPIO8 (LED xanh tren board, active LOW)
;   LED2: GPIO3 -> R 220 ohm -> LED -> GND (active HIGH)
;   BTN : GPIO4 -> nut bam -> GND
[env:esp32c3_super_mini]
board = esp32-c3-devkitm-1
build_flags =
    '-D LED1_PIN=8U'
    '-D LED1_ACT=LOW'
    '-D LED2_PIN=3U'
    '-D LED2_ACT=HIGH'
    '-D BTN_PIN=4U'
    '-D BTN_ACT=LOW'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 Zero (LED tren board la WS2812 nen khong dung duoc, cat ca 2 LED deu la LED ngoai)
;   LED1: GPIO4 -> R 220 ohm -> LED -> GND (active HIGH)
;   LED2: GPIO5 -> R 220 ohm -> LED -> GND (active HIGH)
;   BTN : GPIO6 -> nut bam -> GND
[env:esp32c3_zero]
board = esp32-c3-devkitm-1
build_flags =
    '-D LED1_PIN=4U'
    '-D LED1_ACT=HIGH'
    '-D LED2_PIN=5U'
    '-D LED2_ACT=HIGH'
    '-D BTN_PIN=6U'
    '-D BTN_ACT=LOW'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
