[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    mathertel/OneButton @ ^2.6.1

; ESP32 DevKit v1: nut BOOT = GPIO0, LED xanh tren board = GPIO2
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
build_flags =
    '-D BTN_PIN=0U'
    '-D BTN_ACT=LOW'
    '-D LED_PIN=2U'
    '-D LED_ACT=HIGH'

; ESP32-C3 Super Mini: nut BOOT = GPIO9, LED tren board = GPIO8 (active LOW)
[env:esp32c3_super_mini]
board = esp32-c3-devkitm-1
build_flags =
    '-D BTN_PIN=9U'
    '-D BTN_ACT=LOW'
    '-D LED_PIN=8U'
    '-D LED_ACT=LOW'

; ESP32-C3 Zero: nut BOOT = GPIO9, LED ngoai o GPIO4 (GPIO4 -> R 220 ohm -> LED -> GND, active HIGH)
[env:esp32c3_zero]
board = esp32-c3-devkitm-1
build_flags =
    '-D BTN_PIN=9U'
    '-D BTN_ACT=LOW'
    '-D LED_PIN=4U'
    '-D LED_ACT=HIGH'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
